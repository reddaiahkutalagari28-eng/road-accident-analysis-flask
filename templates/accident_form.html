{% extends "base.html" %}{% block content %}<div class="heading"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>{{ 'Edit accident record' if mode=='edit' else 'Add accident record' }}</h1><div class="muted">Location is required. Coordinates are optional.</div></div><a class="btn btn-outline-secondary" href="{{ url_for('records') }}">← Back</a></div><form method="post" class="panel formpanel"><div class="formgrid"><div><label>Accident date *</label><input class="form-control" type="date" name="accident_date" value="{{ accident.accident_date }}" required></div><div><label>Location / road name *</label><input class="form-control" name="location" value="{{ accident.location }}" placeholder="e.g. Rajampeta Main Road" required></div><div><label>Severity</label><select class="form-select" name="severity">{% for s in severities %}<option {{ 'selected' if accident.severity==s }}>{{ s }}</option>{% endfor %}</select></div><div><label>Weather condition</label><select class="form-select" name="weather">{% for w in weather_types %}<option {{ 'selected' if accident.weather==w }}>{{ w }}</option>{% endfor %}</select></div><div><label>Latitude</label><input class="form-control" type="number" step="any" min="-90" max="90" name="latitude" value="{{ accident.latitude if accident.latitude is not none else '' }}" placeholder="14.195"></div><div><label>Longitude</label><input class="form-control" type="number" step="any" min="-180" max="180" name="longitude" value="{{ accident.longitude if accident.longitude is not none else '' }}" placeholder="79.159"></div><div style="grid-column:1/-1"><label>Additional notes</label><textarea class="form-control" name="description" rows="4" maxlength="2000" placeholder="Enter accident details…">{{ accident.description or '' }}</textarea></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('records') }}">Cancel</a><button class="btn btn-primary">{{ 'Save changes' if mode=='edit' else 'Save accident record' }} →</button></div></form>{% endblock %}
